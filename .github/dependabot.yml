version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # pytest-homeassistant-custom-component pins these exactly; they arrive
    # with its updates, separate bumps cannot be installed.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
