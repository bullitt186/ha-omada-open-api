name: Omada startup regression (upstream sync)

on:
  push:
    branches:
      - fix/startup-transient-api-retry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements_dev.txt
      - name: Ruff and mypy
        run: |
          ruff check custom_components/ tests/
          ruff format --check custom_components/ tests/
          mypy --config-file pyproject.toml custom_components/omada_open_api/
      - name: Regression tests and coverage
        run: |
          pytest tests/ --cov=custom_components.omada_open_api \
            --cov-report=term-missing \
            --cov-fail-under=$(cat .coverage-threshold) -n auto -q
