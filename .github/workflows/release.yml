name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements_dev.txt

      # Mirrors pre-commit: pre-commit-hooks
      - name: Check trailing whitespace
        run: |
          git ls-files -z -- ':(exclude)*.pxd' ':(exclude)*.png' | xargs -0 grep -Prl '\s+$' && \
            { echo '❌ Trailing whitespace found'; exit 1; } || \
            echo '✅ No trailing whitespace'

      - name: Check for merge conflicts
        run: |
          if git ls-files -z | xargs -0 grep -l '^<<<<<<< ' 2>/dev/null; then
            echo '❌ Merge conflict markers found'; exit 1
          fi
          echo '✅ No merge conflict markers'

      # Full pre-commit equivalent suite
      - name: Ruff lint
        run: ruff check custom_components/ tests/

      - name: Ruff format check
        run: ruff format --check custom_components/ tests/

      - name: Pylint
        run: pylint --rcfile=pyproject.toml custom_components/omada_open_api/

      - name: Mypy strict
        run: mypy --config-file pyproject.toml custom_components/omada_open_api/

      - name: Tests with coverage gate
        run: |
          pytest tests/ \
            --cov=custom_components.omada_open_api \
            --cov-report=term-missing \
            --cov-fail-under=$(cat .coverage-threshold) \
            -n auto \
            -v

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

      - name: hassfest validation
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed to check whether the tag is on main

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/omada_open_api/manifest.json'))['version'])")
          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ Version mismatch: tag $TAG_VERSION ≠ manifest $MANIFEST_VERSION"
            echo "   Update manifest.json version before tagging."
            exit 1
          fi
          echo "✅ Versions match"

      # PEP 440 pre-release suffixes (1.11.0a1, 1.11.0b1, 1.11.0rc1) publish a
      # GitHub pre-release, which HACS only offers to users who opted in to
      # beta versions. Everything else is a stable release.
      - name: Detect release channel
        id: channel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "🧪 Beta channel: publishing a GitHub pre-release"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "📦 Stable channel: publishing the latest release"
          else
            echo "❌ Unsupported version $VERSION."
            echo "   Use X.Y.Z for stable or X.Y.Z(a|b|rc)N for a pre-release (e.g. 1.2.0b1)."
            exit 1
          fi

      - name: Verify stable releases are tagged on main
        if: steps.channel.outputs.prerelease == 'false'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Stable tag $GITHUB_REF_NAME is not on main."
            echo "   Merge the work into main first, or use a pre-release version (e.g. 1.2.0b1)."
            exit 1
          fi
          echo "✅ Tag is on main"

  release:
    name: Create GitHub Release
    needs: [quality-gate, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Build release archive
        run: |
          cd custom_components/omada_open_api
          zip -r ../../omada_open_api.zip . \
            -x "__pycache__/*" "*.pyc" ".mypy_cache/*"

      - name: Read release notes
        id: release_notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "Found RELEASE_NOTES.md — using pre-written release notes"
            {
              echo "body<<EOF"
              cat RELEASE_NOTES.md
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_NOTES.md not found — falling back to git log"
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
            CURRENT_TAG="${GITHUB_REF_NAME}"
            {
              echo "body<<EOF"
              echo "## Changes"
              echo ""
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
                git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" --no-merges
              else
                git log --pretty=format:"- %s" --no-merges -20
              fi
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: omada_open_api.zip
          prerelease: ${{ needs.version-check.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version-check.outputs.prerelease == 'true' && 'false' || 'true' }}
          body: |
            ${{ steps.release_notes.outputs.body }}

            ---
            **Installation:** Download `omada_open_api.zip`, extract to `config/custom_components/omada_open_api/`, and restart Home Assistant. Or install via HACS.
