---
name: Feature Request
description: Suggest a new feature or enhancement for the integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        Before opening a new request, please [search existing feature requests](https://github.com/bullitt186/ha-omada-open-api/issues?q=is%3Aissue+label%3Aenhancement) to see if a similar idea has already been proposed.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched [existing feature requests](https://github.com/bullitt186/ha-omada-open-api/issues?q=is%3Aissue+label%3Aenhancement) and this is not a duplicate.
          required: true
        - label: This request contains only one feature (open separate issues for separate features).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: "A clear and concise description of the problem or frustration that motivated this request."
      placeholder: "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: "A clear and concise description of any alternative solutions or workarounds you've considered."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: "Any other context, screenshots, API documentation references, or examples that might help."
    validations:
      required: false
